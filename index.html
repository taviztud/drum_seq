<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1917">
  <meta name="description" content="A pocket studio of vintage machines: two TB-303 style bass lines and sampled TR-808, TR-909, LinnDrum and more.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>drum_seq</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="vendor/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="transport" aria-label="Transport">
      <button id="play" class="play" type="button" aria-pressed="false" aria-label="Play" aria-keyshortcuts="Space">
        <span class="play-icon" aria-hidden="true"></span>
      </button>
      <div class="tempo">
        <button id="bpm-down" class="nudge" type="button" aria-label="Slower">−</button>
        <div id="bpm" class="lcd" role="slider" tabindex="0" aria-label="Tempo in BPM" aria-valuemin="40" aria-valuemax="300">
          <span class="lcd-digits"></span><span class="lcd-unit">bpm</span>
        </div>
        <button id="bpm-up" class="nudge" type="button" aria-label="Faster">+</button>
        <button id="tap" class="tap" type="button">Tap</button>
      </div>
      <div id="scenes" class="scenes" role="group" aria-label="Scene"></div>
    </header>

    <main class="stage">
      <section id="view-bass1" class="view" aria-label="Bass line 1" data-view="bass1"></section>
      <section id="view-bass2" class="view" aria-label="Bass line 2" data-view="bass2" hidden></section>
      <section id="view-drums" class="view" aria-label="Drum machine" data-view="drums" hidden></section>
      <section id="view-mixer" class="view" aria-label="Mixer" data-view="mixer" hidden></section>
      <section id="view-song" class="view" aria-label="Song" data-view="song" hidden></section>
    </main>

    <nav class="tabs" aria-label="Machines">
      <button type="button" data-tab="bass1" aria-current="page"><span class="tab-led" aria-hidden="true"></span>Bass 1</button>
      <button type="button" data-tab="bass2"><span class="tab-led" aria-hidden="true"></span>Bass 2</button>
      <button type="button" data-tab="drums"><span class="tab-led" aria-hidden="true"></span>Drums</button>
      <button type="button" data-tab="mixer">Mixer</button>
      <button type="button" data-tab="song">Song</button>
    </nav>
  </div>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>
</body>
</html>
